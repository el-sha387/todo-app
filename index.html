<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Todos">
  <link rel="manifest" href="manifest.json">
  <title>Todos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --surface2: #F8FAFC;
      --text: #0F172A;
      --text2: #64748B;
      --text3: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.08);
      --radius: 14px;
      --primary: #6366F1;
      --primary-light: #EEF2FF;
      --c-haushalt: #3B82F6;
      --c-haushalt-bg: #EFF6FF;
      --c-garten: #22C55E;
      --c-garten-bg: #F0FDF4;
      --c-druck: #F97316;
      --c-druck-bg: #FFF7ED;
      --c-kids: #EC4899;
      --c-kids-bg: #FDF2F8;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── Layout ── */
    #app {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 0) 0 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .btn-add-header {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(99,102,241,.4);
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .btn-add-header:active { transform: scale(.93); box-shadow: 0 1px 4px rgba(99,102,241,.3); }

    /* ── Filter tabs ── */
    .filter-scroll {
      overflow-x: auto;
      padding: 0 20px 12px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }

    .filter-tabs {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .filter-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .filter-tab[data-cat="haushalt"].active { background: var(--c-haushalt); border-color: var(--c-haushalt); }
    .filter-tab[data-cat="garten"].active   { background: var(--c-garten);   border-color: var(--c-garten); }
    .filter-tab[data-cat="druck"].active    { background: var(--c-druck);     border-color: var(--c-druck); }
    .filter-tab[data-cat="kids"].active     { background: var(--c-kids);      border-color: var(--c-kids); }

    /* ── Main content ── */
    main {
      flex: 1;
      padding: 12px 16px 100px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--text3);
      padding: 4px 4px 8px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* ── Todo card ── */
    .todo-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      transition: opacity .2s, transform .15s;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .todo-card.done {
      opacity: .5;
    }

    .check-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn svg { display: none; }
    .todo-card.done .check-btn {
      border-color: transparent;
    }
    .todo-card.done .check-btn svg { display: block; }

    .check-btn[data-cat="haushalt"] { border-color: var(--c-haushalt); }
    .check-btn[data-cat="garten"]   { border-color: var(--c-garten); }
    .check-btn[data-cat="druck"]    { border-color: var(--c-druck); }
    .check-btn[data-cat="kids"]     { border-color: var(--c-kids); }
    .todo-card.done .check-btn[data-cat="haushalt"] { background: var(--c-haushalt); }
    .todo-card.done .check-btn[data-cat="garten"]   { background: var(--c-garten); }
    .todo-card.done .check-btn[data-cat="druck"]    { background: var(--c-druck); }
    .todo-card.done .check-btn[data-cat="kids"]     { background: var(--c-kids); }

    .todo-body { flex: 1; min-width: 0; }

    .todo-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
      word-break: break-word;
      transition: text-decoration .15s;
    }
    .todo-card.done .todo-title {
      text-decoration: line-through;
      color: var(--text2);
    }

    .cat-badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .cat-badge[data-cat="haushalt"] { background: var(--c-haushalt-bg); color: var(--c-haushalt); }
    .cat-badge[data-cat="garten"]   { background: var(--c-garten-bg);   color: var(--c-garten); }
    .cat-badge[data-cat="druck"]    { background: var(--c-druck-bg);     color: var(--c-druck); }
    .cat-badge[data-cat="kids"]     { background: var(--c-kids-bg);      color: var(--c-kids); }

    .delete-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text3);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
      font-size: 18px;
    }
    .delete-btn:active { background: #FEE2E2; color: #EF4444; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text3);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── Modal backdrop ── */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(4px);
      z-index: 20;
      animation: fadeIn .2s ease;
    }
    .backdrop.open { display: flex; align-items: flex-end; justify-content: center; }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

    /* ── Modal sheet ── */
    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 0 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
      box-shadow: var(--shadow-lg);
      animation: slideUp .25s cubic-bezier(.32,1,.44,1);
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 12px auto 20px;
    }

    .modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 8px;
    }

    .title-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color .15s;
      margin-bottom: 20px;
    }
    .title-input:focus { border-color: var(--primary); background: #fff; }

    /* ── Category picker ── */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .cat-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-option input { display: none; }
    .cat-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-option span { font-size: 14px; font-weight: 500; }

    .cat-option[data-cat="haushalt"] .cat-dot { background: var(--c-haushalt); }
    .cat-option[data-cat="garten"]   .cat-dot { background: var(--c-garten); }
    .cat-option[data-cat="druck"]    .cat-dot { background: var(--c-druck); }
    .cat-option[data-cat="kids"]     .cat-dot { background: var(--c-kids); }

    .cat-option[data-cat="haushalt"].selected { border-color: var(--c-haushalt); background: var(--c-haushalt-bg); }
    .cat-option[data-cat="garten"].selected   { border-color: var(--c-garten);   background: var(--c-garten-bg); }
    .cat-option[data-cat="druck"].selected    { border-color: var(--c-druck);     background: var(--c-druck-bg); }
    .cat-option[data-cat="kids"].selected     { border-color: var(--c-kids);      background: var(--c-kids-bg); }

    /* ── Modal actions ── */
    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text2);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-save {
      flex: 2;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(99,102,241,.35);
      transition: opacity .15s, transform .1s;
    }
    .btn-save:active { opacity: .85; transform: scale(.98); }
    .btn-save:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ── Count badge in header ── */
    .count-badge {
      font-size: 13px;
      font-weight: 500;
      color: var(--text3);
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <div>
        <h1>Todos</h1>
        <span class="count-badge" id="count-label"></span>
      </div>
      <button class="btn-add-header" id="btn-open" aria-label="Aufgabe hinzufügen">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 3v12M3 9h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="filter-scroll">
      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-cat="all">Alle</button>
        <button class="filter-tab" data-cat="haushalt">Haushalt</button>
        <button class="filter-tab" data-cat="garten">Garten</button>
        <button class="filter-tab" data-cat="druck">3D Druck</button>
        <button class="filter-tab" data-cat="kids">Kids</button>
      </div>
    </div>
  </header>

  <main id="main"></main>
</div>

<!-- Add-Todo Modal -->
<div class="backdrop" id="backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-handle"></div>
    <h2 id="modal-title">Neue Aufgabe</h2>

    <div class="field-label">Titel</div>
    <input type="text" class="title-input" id="todo-input"
           placeholder="Was muss erledigt werden?" maxlength="80" autocomplete="off">

    <div class="field-label">Kategorie</div>
    <div class="cat-grid" id="cat-grid">
      <label class="cat-option" data-cat="haushalt">
        <input type="radio" name="cat" value="haushalt">
        <span class="cat-dot"></span>
        <span>Haushalt</span>
      </label>
      <label class="cat-option" data-cat="garten">
        <input type="radio" name="cat" value="garten">
        <span class="cat-dot"></span>
        <span>Garten</span>
      </label>
      <label class="cat-option" data-cat="druck">
        <input type="radio" name="cat" value="druck">
        <span class="cat-dot"></span>
        <span>3D Druck</span>
      </label>
      <label class="cat-option" data-cat="kids">
        <input type="radio" name="cat" value="kids">
        <span class="cat-dot"></span>
        <span>Kids</span>
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Abbrechen</button>
      <button class="btn-save" id="btn-save" disabled>Hinzufügen</button>
    </div>
  </div>
</div>

<script>
const CATS = {
  haushalt: 'Haushalt',
  garten:   'Garten',
  druck:    '3D Druck',
  kids:     'Kids',
};

let todos = [];
let filter = 'all';

function load() {
  try { todos = JSON.parse(localStorage.getItem('todos') || '[]'); }
  catch { todos = []; }
}

function save() {
  localStorage.setItem('todos', JSON.stringify(todos));
}

function addTodo(title, cat) {
  todos.unshift({ id: Date.now().toString(36), title: title.trim(), cat, done: false });
  save();
  render();
}

function toggle(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function remove(id) {
  todos = todos.filter(t => t.id !== id);
  save();
  render();
}

// ── Render ──────────────────────────────────────────
function render() {
  const main = document.getElementById('main');
  const filtered = filter === 'all' ? todos : todos.filter(t => t.cat === filter);
  const open = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);

  const total = todos.filter(t => !t.done).length;
  document.getElementById('count-label').textContent =
    total > 0 ? `${total} offen` : 'Alles erledigt ✓';

  if (filtered.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>${filter === 'all' ? 'Noch keine Aufgaben.' : 'Keine Aufgaben in dieser Kategorie.'}</p>
      </div>`;
    return;
  }

  let html = '';

  if (open.length > 0) {
    html += `<div class="section-label">Offen (${open.length})</div>
             <div class="todo-list">${open.map(cardHTML).join('')}</div>`;
  }

  if (done.length > 0) {
    html += `<div class="section-label">Erledigt (${done.length})</div>
             <div class="todo-list">${done.map(cardHTML).join('')}</div>`;
  }

  main.innerHTML = html;

  main.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => toggle(btn.dataset.id));
  });
  main.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => remove(btn.dataset.id));
  });
}

function cardHTML(t) {
  const label = CATS[t.cat] || t.cat;
  return `
    <div class="todo-card${t.done ? ' done' : ''}">
      <button class="check-btn" data-id="${t.id}" data-cat="${t.cat}" aria-label="Erledigt umschalten">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 7l3.5 3.5 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="todo-body">
        <div class="todo-title">${escHtml(t.title)}</div>
        <span class="cat-badge" data-cat="${t.cat}">${label}</span>
      </div>
      <button class="delete-btn" data-id="${t.id}" aria-label="Löschen">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Filter tabs ──────────────────────────────────────
document.getElementById('filter-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  filter = tab.dataset.cat;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

// ── Modal ────────────────────────────────────────────
const backdrop = document.getElementById('backdrop');
const input    = document.getElementById('todo-input');
const saveBtn  = document.getElementById('btn-save');
let selectedCat = null;

function openModal() {
  backdrop.classList.add('open');
  input.value = '';
  selectedCat = null;
  saveBtn.disabled = true;
  document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
  document.querySelectorAll('input[name="cat"]').forEach(r => r.checked = false);
  setTimeout(() => input.focus(), 100);
}

function closeModal() {
  backdrop.classList.remove('open');
  input.blur();
}

document.getElementById('btn-open').addEventListener('click', openModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

// Category selection
document.getElementById('cat-grid').addEventListener('click', e => {
  const opt = e.target.closest('.cat-option');
  if (!opt) return;
  document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
  opt.classList.add('selected');
  opt.querySelector('input').checked = true;
  selectedCat = opt.dataset.cat;
  updateSaveBtn();
});

input.addEventListener('input', updateSaveBtn);

function updateSaveBtn() {
  saveBtn.disabled = !(input.value.trim() && selectedCat);
}

saveBtn.addEventListener('click', () => {
  if (!input.value.trim() || !selectedCat) return;
  addTodo(input.value, selectedCat);
  closeModal();
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !saveBtn.disabled) {
    addTodo(input.value, selectedCat);
    closeModal();
  }
});

// ── PWA Service Worker ───────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── Init ─────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
