<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E293B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Todos">
  <link rel="manifest" href="manifest.json">
  <title>Todos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F1F5F9; --surface: #FFFFFF; --surface2: #F8FAFC;
      --text: #0F172A; --text2: #64748B; --text3: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.08);
      --radius: 14px; --primary: #6366F1;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F172A; --surface: #1E293B; --surface2: #263348;
        --text: #F1F5F9; --text2: #94A3B8; --text3: #475569;
        --border: #334155;
        --shadow: 0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
        --shadow-lg: 0 10px 25px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.35);
      }
    }

    html, body { height: 100%; height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    #app { height: 100%; height: 100dvh; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; }

    /* ── Header ── */
    header { flex-shrink: 0; position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding-top: var(--safe-top); }
    .header-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; line-height: 1.1; }
    .count-badge { font-size: 13px; font-weight: 500; color: var(--text3); display: block; margin-top: 1px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, background .15s;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    }
    .btn-settings { background: var(--surface2); color: var(--text2); }
    .btn-settings:active { background: var(--border); transform: scale(.91); }
    .btn-add-header { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.4); }
    .btn-add-header:active { transform: scale(.91); box-shadow: 0 1px 4px rgba(99,102,241,.3); }

    /* ── Filter tabs ── */
    .filter-scroll { overflow-x: auto; padding: 0 20px 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-tabs { display: flex; gap: 8px; width: max-content; }
    .filter-tab {
      padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--surface2); color: var(--text2); font-size: 14px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all .15s; min-height: 36px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    }
    .filter-tab.active { color: #fff; }

    /* ── Main ── */
    main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px calc(var(--safe-bottom) + 24px); }
    .section-label { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); padding: 4px 4px 8px; }
    .todo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

    /* ── Swipe wrapper ── */
    .todo-wrap { position: relative; border-radius: var(--radius); }
    .swipe-bg { position: absolute; inset: 0; border-radius: var(--radius); display: flex; align-items: center; opacity: 0; }
    .swipe-bg-right { background: #DCFCE7; padding-left: 20px; }
    .swipe-bg-left  { background: #FEE2E2; justify-content: flex-end; padding-right: 20px; }
    @media (prefers-color-scheme: dark) {
      .swipe-bg-right { background: #14352a; }
      .swipe-bg-left  { background: #3d1515; }
    }

    /* ── Todo card ── */
    .todo-card {
      position: relative; z-index: 1; background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px;
      padding: 12px 12px 12px 4px; -webkit-tap-highlight-color: transparent;
    }
    .todo-card.done { opacity: .45; }
    .todo-card.overdue   { border-left: 3px solid #EF4444; }
    .todo-card.important:not(.overdue) { border-left: 3px solid #F59E0B; }

    .check-btn { width: 44px; height: 44px; border: none; background: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .check-ring { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
    .check-ring svg { display: none; }
    .todo-card.done .check-ring svg { display: block; }
    .todo-card.done .check-ring { border-color: transparent !important; }

    .todo-body { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: flex-start; gap: 6px; }
    .todo-title { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.35; word-break: break-word; }
    .todo-card.done .todo-title { text-decoration: line-through; color: var(--text2); }
    .star-btn { font-size: 17px; line-height: 1; background: none; border: none; cursor: pointer; color: var(--text3); padding: 1px 2px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: color .15s, transform .15s; }
    .star-btn.active { color: #F59E0B; }
    .star-btn:active { transform: scale(1.25); }
    .todo-note { font-size: 13px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .todo-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }

    .cat-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .due-label { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .due-overdue  { background: #FEE2E2; color: #DC2626; }
    .due-today    { background: #FEF3C7; color: #B45309; }
    .due-soon     { background: #DCFCE7; color: #15803D; }
    .due-upcoming { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

    .delete-btn { width: 44px; height: 44px; border: none; background: none; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color .15s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .delete-btn:active { color: #EF4444; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text3); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── Backdrops ── */
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 20; }
    .backdrop.open { display: flex; align-items: flex-end; justify-content: center; }
    @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

    /* ── Modal sheet (shared) ── */
    .modal {
      background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 540px;
      max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 20px calc(var(--safe-bottom) + 20px);
      box-shadow: var(--shadow-lg); animation: slideUp .28s cubic-bezier(.32,1,.44,1);
    }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 12px auto 20px; }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    .field-label { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; display: flex; align-items: baseline; gap: 6px; }
    .field-label .opt { font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text3); }

    .text-input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 16px; font-family: inherit; color: var(--text); background: var(--surface2);
      outline: none; transition: border-color .15s; margin-bottom: 20px;
    }
    .text-input.sm { font-size: 15px; }
    .text-input:focus { border-color: var(--primary); background: var(--surface); }

    /* ── Category picker (add-todo modal) ── */
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .cat-option {
      display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 12px;
      border: 2px solid var(--border); background: var(--surface2); cursor: pointer;
      transition: border-color .15s, background .15s; min-height: 48px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    }
    .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cat-option span { font-size: 14px; font-weight: 500; }

    /* ── Due date ── */
    .due-chips { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .due-chip {
      display: flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--surface2); color: var(--text2);
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s;
      font-family: inherit; min-height: 40px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    }
    .due-chip.active { background: #EEF2FF; border-color: var(--primary); color: var(--primary); }
    @media (prefers-color-scheme: dark) { .due-chip.active { background: #1e2060; } }
    .due-date-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--surface2); outline: none; transition: border-color .15s; }
    .due-date-input:focus { border-color: var(--primary); background: var(--surface); }
    .due-date-input.hidden { display: none; }
    .due-section { margin-bottom: 20px; }

    /* ── Modal actions ── */
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: none; color: var(--text2); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; touch-action: manipulation; min-height: 50px; }
    .btn-primary { flex: 2; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(99,102,241,.35); transition: opacity .15s, transform .1s; touch-action: manipulation; min-height: 50px; }
    .btn-primary:active { opacity: .85; transform: scale(.98); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

    /* ── Settings: category list ── */
    .settings-cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .settings-cat-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2); border-radius: 12px;
      padding: 13px 14px; border: 1.5px solid var(--border);
      transition: opacity .15s, box-shadow .15s;
      user-select: none;
    }
    .settings-cat-row.drag-source { opacity: .35; }
    .settings-cat-row.drag-over   { border-color: var(--primary); }
    .drag-handle {
      color: var(--text3); cursor: grab; touch-action: none;
      display: flex; align-items: center; padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .drag-handle:active { cursor: grabbing; }
    .cat-dot-lg { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .cat-row-label { flex: 1; font-size: 15px; font-weight: 500; }
    .cat-todo-count { font-size: 12px; color: var(--text3); background: var(--border); padding: 2px 7px; border-radius: 20px; }
    .cat-del-btn {
      width: 36px; height: 36px; border: none; background: none; border-radius: 8px;
      color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .cat-del-btn:active { background: #FEE2E2; color: #EF4444; }
    .cat-del-btn.confirm { background: #FEE2E2; color: #EF4444; }

    /* ── Settings: add category form ── */
    .add-cat-btn {
      width: 100%; padding: 13px 16px; border-radius: 12px;
      border: 1.5px dashed var(--border); background: none;
      color: var(--text2); font-size: 15px; font-weight: 500; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: border-color .15s, color .15s; margin-bottom: 16px;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .add-cat-btn:active { border-color: var(--primary); color: var(--primary); }
    .add-cat-form { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .add-cat-form.hidden { display: none; }

    /* ── Color swatches ── */
    .color-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent;
      transition: transform .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .color-swatch.selected { border-color: var(--text); transform: scale(1.15); }
    .color-swatch:active { transform: scale(1.1); }

    .settings-divider { height: 1px; background: var(--border); margin: 4px 0 20px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <div>
        <h1>Todos</h1>
        <span class="count-badge" id="count-label"></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn btn-settings" id="btn-settings" aria-label="Einstellungen">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn btn-add-header" id="btn-open" aria-label="Aufgabe hinzufügen">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 3v12M3 9h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="filter-scroll">
      <div class="filter-tabs" id="filter-tabs"></div>
    </div>
  </header>
  <main id="main"></main>
</div>

<!-- Add-Todo Modal -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-handle"></div>
    <h2 id="modal-title">Neue Aufgabe</h2>
    <div class="field-label">Titel</div>
    <input type="text" class="text-input" id="todo-input" placeholder="Was muss erledigt werden?" maxlength="80" autocomplete="off">
    <div class="field-label">Notiz <span class="opt">(optional)</span></div>
    <input type="text" class="text-input sm" id="note-input" placeholder="Zusätzliche Info..." maxlength="120" autocomplete="off">
    <div class="field-label">Kategorie</div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="field-label">Fälligkeit <span class="opt">(optional)</span></div>
    <div class="due-section">
      <div class="due-chips" id="due-chips">
        <button class="due-chip" data-offset="1">Morgen</button>
        <button class="due-chip" data-offset="2">Übermorgen</button>
        <button class="due-chip" id="chip-custom">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="1" y="2" width="11" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M4 1v2M9 1v2M1 5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Datum
        </button>
      </div>
      <input type="date" class="due-date-input hidden" id="due-date-input">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Abbrechen</button>
      <button class="btn-primary" id="btn-save" disabled>Hinzufügen</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="backdrop" id="settings-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-handle"></div>
    <h2 id="settings-title">Einstellungen</h2>
    <div class="field-label">Kategorien</div>
    <div class="settings-cat-list" id="settings-cat-list"></div>
    <button class="add-cat-btn" id="btn-show-add-cat">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Kategorie hinzufügen
    </button>
    <div class="add-cat-form hidden" id="add-cat-form">
      <div class="field-label" style="margin-bottom:10px">Name</div>
      <input type="text" class="text-input" id="new-cat-name" placeholder="Kategoriename..." maxlength="24" autocomplete="off" style="margin-bottom:16px">
      <div class="field-label" style="margin-bottom:10px">Farbe</div>
      <div class="color-grid" id="color-grid"></div>
      <div class="modal-actions" style="margin-top:0">
        <button class="btn-cancel" id="btn-new-cat-cancel">Abbrechen</button>
        <button class="btn-primary" id="btn-new-cat-save" disabled>Hinzufügen</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────
const DEFAULT_CATS = [
  { id: 'haushalt', label: 'Haushalt', color: '#3B82F6' },
  { id: 'garten',   label: 'Garten',   color: '#22C55E' },
  { id: 'druck',    label: '3D Druck', color: '#F97316' },
  { id: 'kids',     label: 'Kids',     color: '#EC4899' },
];
const PRESET_COLORS = ['#3B82F6','#22C55E','#F97316','#EC4899','#8B5CF6','#EF4444','#14B8A6','#F59E0B','#06B6D4','#64748B'];

// ── State ─────────────────────────────────────────────
let todos      = [];
let categories = [];
let filter     = 'all';
let confirmDeleteCat = null; // id awaiting second tap

// ── Persistence ───────────────────────────────────────
function load() {
  try { todos = JSON.parse(localStorage.getItem('todos') || '[]'); } catch { todos = []; }
}
function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

function loadCats() {
  try {
    const s = localStorage.getItem('categories');
    categories = s ? JSON.parse(s) : [...DEFAULT_CATS];
  } catch { categories = [...DEFAULT_CATS]; }
}
function saveCats() { localStorage.setItem('categories', JSON.stringify(categories)); }

// ── Helpers ───────────────────────────────────────────
function isoDate(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function getCat(id) { return categories.find(c => c.id === id) || null; }

function catBg(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.13)`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function uniqueCatId(label) {
  const base = label.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,20) || 'cat';
  if (!categories.find(c => c.id === base)) return base;
  return base + '_' + Date.now().toString(36).slice(-4);
}

// ── Todo mutations ────────────────────────────────────
function addTodo(title, cat, due, note) {
  todos.unshift({ id: Date.now().toString(36), title: title.trim(), cat, due: due||null, note: note||null, important: false, done: false });
  save(); render();
}
function toggle(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}
function toggleImportant(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.important = !t.important; save(); render(); }
}
function remove(id) { todos = todos.filter(t => t.id !== id); save(); render(); }

// ── Category mutations ────────────────────────────────
function addCat(label, color) {
  categories.push({ id: uniqueCatId(label), label, color });
  saveCats(); renderFilterTabs(); renderCatGrid(); renderSettingsCatList();
}
function deleteCat(id) {
  categories = categories.filter(c => c.id !== id);
  if (filter === id) filter = 'all';
  confirmDeleteCat = null;
  saveCats(); renderFilterTabs(); renderCatGrid(); renderSettingsCatList(); render();
}
function reorderCat(fromIdx, toIdx) {
  const [moved] = categories.splice(fromIdx, 1);
  categories.splice(toIdx, 0, moved);
  saveCats(); renderFilterTabs(); renderCatGrid(); renderSettingsCatList();
}

// ── Due date helpers ──────────────────────────────────
function dueLabelInfo(due) {
  if (!due) return null;
  const today = isoDate(0);
  if (due < today)        return { text: 'Überfällig',  cls: 'overdue' };
  if (due === today)      return { text: 'Heute',       cls: 'today' };
  if (due === isoDate(1)) return { text: 'Morgen',      cls: 'soon' };
  if (due === isoDate(2)) return { text: 'Übermorgen',  cls: 'soon' };
  const d = new Date(due + 'T12:00:00');
  return { text: d.toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'short' }), cls: 'upcoming' };
}

function sortOpen(arr) {
  const today = isoDate(0);
  return [...arr].sort((a, b) => {
    if (a.important && !b.important) return -1;
    if (!a.important && b.important) return 1;
    const ad = a.due, bd = b.due;
    if (!ad && !bd) return 0;
    if (!ad) return 1; if (!bd) return -1;
    if (ad < today && bd >= today) return -1;
    if (bd < today && ad >= today) return 1;
    return ad < bd ? -1 : ad > bd ? 1 : 0;
  });
}

// ── Render: filter tabs ───────────────────────────────
function renderFilterTabs() {
  const el = document.getElementById('filter-tabs');
  const allActive = filter === 'all';
  let html = `<button class="filter-tab${allActive?' active':''}" data-cat="all"${allActive?' style="background:var(--primary);border-color:var(--primary)"':''}>Alle</button>`;
  categories.forEach(c => {
    const active = filter === c.id;
    const style = active ? `style="background:${c.color};border-color:${c.color}"` : '';
    html += `<button class="filter-tab${active?' active':''}" data-cat="${c.id}" ${style}>${escHtml(c.label)}</button>`;
  });
  el.innerHTML = html;
}

// ── Render: category grid (add-todo modal) ────────────
function renderCatGrid() {
  const el = document.getElementById('cat-grid');
  el.innerHTML = categories.map(c => `
    <label class="cat-option" data-cat="${c.id}" data-color="${c.color}">
      <input type="radio" name="cat" value="${c.id}">
      <span class="cat-dot" style="background:${c.color}"></span>
      <span>${escHtml(c.label)}</span>
    </label>`).join('');
}

// ── Render: main list ─────────────────────────────────
function render() {
  renderFilterTabs();
  const main = document.getElementById('main');
  const filtered = filter === 'all' ? todos : todos.filter(t => t.cat === filter);
  const open = sortOpen(filtered.filter(t => !t.done));
  const done = filtered.filter(t => t.done);

  const totalOpen = todos.filter(t => !t.done).length;
  const imp = todos.filter(t => !t.done && t.important).length;
  document.getElementById('count-label').textContent =
    totalOpen > 0 ? `${totalOpen} offen${imp > 0 ? ' · '+imp+' ★' : ''}` : 'Alles erledigt ✓';

  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>${filter==='all'?'Noch keine Aufgaben.':'Keine Aufgaben in dieser Kategorie.'}</p></div>`;
    return;
  }

  let html = '';
  if (open.length) html += `<div class="section-label">Offen (${open.length})</div><div class="todo-list">${open.map(wrapHTML).join('')}</div>`;
  if (done.length) html += `<div class="section-label">Erledigt (${done.length})</div><div class="todo-list">${done.map(wrapHTML).join('')}</div>`;
  main.innerHTML = html;

  main.querySelectorAll('.check-btn').forEach(b  => b.addEventListener('click', () => toggle(b.dataset.id)));
  main.querySelectorAll('.star-btn').forEach(b   => b.addEventListener('click', () => toggleImportant(b.dataset.id)));
  main.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', () => remove(b.dataset.id)));
  main.querySelectorAll('.todo-wrap').forEach(wrap => {
    const card = wrap.querySelector('.todo-card');
    initSwipe(card, wrap.querySelector('.swipe-bg-right'), wrap.querySelector('.swipe-bg-left'),
              card.dataset.id, card.classList.contains('done'));
  });
}

function wrapHTML(t) {
  return `<div class="todo-wrap">${cardHTML(t)}</div>`;
}

function cardHTML(t) {
  const cat   = getCat(t.cat);
  const color = cat ? cat.color : '#94A3B8';
  const label = cat ? cat.label : t.cat;
  const bg    = catBg(color);
  const due   = dueLabelInfo(t.due);
  const isOverdue = !t.done && due?.cls === 'overdue';
  const cls = [t.done?'done':'', isOverdue?'overdue':'', t.important?'important':''].filter(Boolean).join(' ');
  const ringStyle = t.done
    ? `background:${color};border-color:${color}`
    : `border-color:${color}`;
  return `
    <div class="todo-card ${cls}" data-id="${t.id}">
      <button class="check-btn" data-id="${t.id}" aria-label="Erledigt umschalten">
        <span class="check-ring" style="${ringStyle}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3.5 3.5 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div class="todo-body">
        <div class="title-row">
          <div class="todo-title">${escHtml(t.title)}</div>
          <button class="star-btn${t.important?' active':''}" data-id="${t.id}" aria-label="Wichtig">${t.important?'★':'☆'}</button>
        </div>
        ${t.note ? `<div class="todo-note">${escHtml(t.note)}</div>` : ''}
        <div class="todo-meta">
          <span class="cat-badge" style="background:${bg};color:${color}">${escHtml(label)}</span>
          ${due ? `<span class="due-label due-${due.cls}">${due.text}</span>` : ''}
        </div>
      </div>
      <button class="delete-btn" data-id="${t.id}" aria-label="Löschen">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="swipe-bg swipe-bg-right"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="swipe-bg swipe-bg-left"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M5 5l12 12M17 5L5 17" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg></div>`;
}

// ── Swipe ─────────────────────────────────────────────
function initSwipe(card, bgR, bgL, id, isDone) {
  let startX, startY, dx = 0, active = false;
  card.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; active = false; card.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    const ddx = e.touches[0].clientX - startX;
    const ddy = e.touches[0].clientY - startY;
    if (!active) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      if (Math.abs(ddy) >= Math.abs(ddx)) return;
      active = true;
    }
    e.preventDefault();
    dx = isDone ? Math.min(0, ddx) : ddx;
    card.style.transform = `translateX(${dx}px)`;
    const p = Math.min(1, Math.abs(dx) / 75);
    bgR.style.opacity = dx > 0 ? p : 0;
    bgL.style.opacity = dx < 0 ? p : 0;
  }, { passive: false });
  card.addEventListener('touchend', () => {
    if (!active) return;
    card.style.transition = 'transform .22s cubic-bezier(.4,0,.2,1), opacity .22s';
    if (!isDone && dx >= 85) {
      card.style.transform = 'translateX(110vw)'; card.style.opacity = '0';
      setTimeout(() => toggle(id), 220);
    } else if (dx <= -85) {
      card.style.transform = 'translateX(-110vw)'; card.style.opacity = '0';
      setTimeout(() => remove(id), 220);
    } else {
      card.style.transform = ''; bgR.style.opacity = 0; bgL.style.opacity = 0;
    }
    dx = 0; active = false;
  }, { passive: true });
}

// ── Filter tab clicks ─────────────────────────────────
document.getElementById('filter-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  filter = tab.dataset.cat;
  render();
});

// ── Add-todo modal ────────────────────────────────────
const backdrop     = document.getElementById('backdrop');
const input        = document.getElementById('todo-input');
const noteInput    = document.getElementById('note-input');
const saveBtn      = document.getElementById('btn-save');
const dueDateInput = document.getElementById('due-date-input');
let selectedCat = null, selectedDue = null, selectedCatColor = null;

function openModal() {
  backdrop.classList.add('open');
  input.value = ''; noteInput.value = '';
  selectedCat = null; selectedDue = null; selectedCatColor = null;
  saveBtn.disabled = true;
  renderCatGrid();
  document.querySelectorAll('.cat-option').forEach(o => { o.style.borderColor=''; o.style.background=''; });
  document.querySelectorAll('.due-chip').forEach(c => c.classList.remove('active'));
  dueDateInput.value = ''; dueDateInput.classList.add('hidden');
  dueDateInput.min = isoDate(0);
  setTimeout(() => input.focus(), 150);
}
function closeModal() { backdrop.classList.remove('open'); input.blur(); noteInput.blur(); dueDateInput.blur(); }

document.getElementById('btn-open').addEventListener('click', openModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

document.getElementById('cat-grid').addEventListener('click', e => {
  const opt = e.target.closest('.cat-option');
  if (!opt) return;
  document.querySelectorAll('.cat-option').forEach(o => { o.style.borderColor=''; o.style.background=''; });
  selectedCat = opt.dataset.cat;
  selectedCatColor = opt.dataset.color;
  opt.style.borderColor = selectedCatColor;
  opt.style.background  = catBg(selectedCatColor);
  opt.querySelector('input').checked = true;
  updateSaveBtn();
});

document.getElementById('due-chips').addEventListener('click', e => {
  const chip = e.target.closest('.due-chip');
  if (!chip) return;
  if (chip.id === 'chip-custom') {
    const showing = !dueDateInput.classList.contains('hidden');
    if (showing) { dueDateInput.classList.add('hidden'); dueDateInput.value=''; chip.classList.remove('active'); selectedDue=null; }
    else { dueDateInput.classList.remove('hidden'); document.querySelector('.due-chip[data-offset="1"]').classList.remove('active'); document.querySelector('.due-chip[data-offset="2"]').classList.remove('active'); chip.classList.add('active'); selectedDue=null; setTimeout(()=>dueDateInput.focus(),50); }
    return;
  }
  const newDue = isoDate(parseInt(chip.dataset.offset));
  if (selectedDue === newDue) { selectedDue=null; chip.classList.remove('active'); }
  else { selectedDue=newDue; document.querySelectorAll('.due-chip').forEach(c=>c.classList.remove('active')); dueDateInput.classList.add('hidden'); dueDateInput.value=''; chip.classList.add('active'); }
});

dueDateInput.addEventListener('change', e => {
  selectedDue = e.target.value || null;
  if (selectedDue) { document.querySelector('.due-chip[data-offset="1"]').classList.remove('active'); document.querySelector('.due-chip[data-offset="2"]').classList.remove('active'); document.getElementById('chip-custom').classList.add('active'); }
});

input.addEventListener('input', updateSaveBtn);
function updateSaveBtn() { saveBtn.disabled = !(input.value.trim() && selectedCat); }
saveBtn.addEventListener('click', () => { if (!input.value.trim()||!selectedCat) return; addTodo(input.value, selectedCat, selectedDue, noteInput.value); closeModal(); });
input.addEventListener('keydown', e => { if (e.key==='Enter'&&!saveBtn.disabled) { addTodo(input.value,selectedCat,selectedDue,noteInput.value); closeModal(); } });

// ── Settings modal ────────────────────────────────────
const settingsBackdrop = document.getElementById('settings-backdrop');

function openSettings() {
  confirmDeleteCat = null;
  settingsBackdrop.classList.add('open');
  renderSettingsCatList();
  renderColorGrid();
  document.getElementById('add-cat-form').classList.add('hidden');
  document.getElementById('new-cat-name').value = '';
  document.getElementById('btn-new-cat-save').disabled = true;
}
function closeSettings() { settingsBackdrop.classList.remove('open'); confirmDeleteCat = null; }

document.getElementById('btn-settings').addEventListener('click', openSettings);
settingsBackdrop.addEventListener('click', e => { if (e.target === settingsBackdrop) closeSettings(); });

// ── Settings: category list render ───────────────────
function renderSettingsCatList() {
  const list = document.getElementById('settings-cat-list');
  list.innerHTML = categories.map((cat, i) => {
    const count = todos.filter(t => t.cat === cat.id).length;
    const isConfirm = confirmDeleteCat === cat.id;
    return `
      <div class="settings-cat-row" data-index="${i}" data-id="${cat.id}">
        <div class="drag-handle" aria-label="Sortieren">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 6h12M3 9h12M3 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="cat-dot-lg" style="background:${cat.color}"></span>
        <span class="cat-row-label">${escHtml(cat.label)}</span>
        ${count > 0 ? `<span class="cat-todo-count">${count}</span>` : ''}
        <button class="cat-del-btn${isConfirm?' confirm':''}" data-id="${cat.id}" aria-label="Löschen">
          ${isConfirm
            ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
            : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
          }
        </button>
      </div>`;
  }).join('');

  list.querySelectorAll('.cat-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const count = todos.filter(t => t.cat === id).length;
      if (count === 0 || confirmDeleteCat === id) {
        deleteCat(id);
      } else {
        confirmDeleteCat = id;
        renderSettingsCatList();
      }
    });
  });

  initSettingsDrag(list);
}

// ── Settings: drag & drop ─────────────────────────────
function initSettingsDrag(list) {
  let drag = null;

  list.addEventListener('touchstart', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const row = handle.closest('.settings-cat-row');
    const rows = [...list.querySelectorAll('.settings-cat-row')];
    const fromIdx = parseInt(row.dataset.index);
    const rect = row.getBoundingClientRect();
    const offsetY = e.touches[0].clientY - rect.top;

    const ghost = row.cloneNode(true);
    Object.assign(ghost.style, {
      position: 'fixed', left: rect.left+'px', top: rect.top+'px',
      width: rect.width+'px', zIndex: '999', pointerEvents: 'none',
      opacity: '0.92', boxShadow: '0 8px 24px rgba(0,0,0,.18)',
      borderRadius: '12px', background: 'var(--surface)',
    });
    document.body.appendChild(ghost);
    row.classList.add('drag-source');

    drag = { row, ghost, fromIdx, toIdx: fromIdx, offsetY, rows };
    e.preventDefault();

    function onMove(ev) {
      const y = ev.touches[0].clientY;
      ghost.style.top = (y - offsetY) + 'px';
      let newTo = drag.fromIdx;
      drag.rows.forEach((r, i) => {
        if (r === row) return;
        const rc = r.getBoundingClientRect();
        if (y > rc.top + rc.height / 2) newTo = i;
      });
      if (newTo !== drag.toIdx) {
        drag.toIdx = newTo;
        const h = row.getBoundingClientRect().height + 8;
        drag.rows.forEach((r, i) => {
          if (r === row) { r.style.transform = ''; return; }
          const from = drag.fromIdx, to = drag.toIdx;
          if (from < to && i > from && i <= to)       r.style.transform = `translateY(-${h}px)`;
          else if (from > to && i >= to && i < from)  r.style.transform = `translateY(${h}px)`;
          else                                         r.style.transform = '';
        });
      }
      ev.preventDefault();
    }

    function onEnd() {
      ghost.remove();
      row.classList.remove('drag-source');
      drag.rows.forEach(r => { r.style.transform = ''; });
      if (drag.toIdx !== drag.fromIdx) reorderCat(drag.fromIdx, drag.toIdx);
      drag = null;
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    }

    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd, { passive: true });
  }, { passive: false });
}

// ── Settings: color grid ──────────────────────────────
let newCatColor = PRESET_COLORS[4];

function renderColorGrid() {
  const grid = document.getElementById('color-grid');
  grid.innerHTML = PRESET_COLORS.map(c => `
    <div class="color-swatch${c===newCatColor?' selected':''}" data-color="${c}"
         style="background:${c}" aria-label="${c}"></div>`).join('');
  grid.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      newCatColor = sw.dataset.color;
      grid.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('selected', s.dataset.color === newCatColor));
    });
  });
}

document.getElementById('btn-show-add-cat').addEventListener('click', () => {
  document.getElementById('add-cat-form').classList.remove('hidden');
  document.getElementById('btn-show-add-cat').style.display = 'none';
  newCatColor = PRESET_COLORS[4];
  renderColorGrid();
  setTimeout(() => document.getElementById('new-cat-name').focus(), 100);
});

document.getElementById('new-cat-name').addEventListener('input', e => {
  document.getElementById('btn-new-cat-save').disabled = !e.target.value.trim();
});

document.getElementById('btn-new-cat-cancel').addEventListener('click', () => {
  document.getElementById('add-cat-form').classList.add('hidden');
  document.getElementById('btn-show-add-cat').style.display = '';
  document.getElementById('new-cat-name').value = '';
  document.getElementById('btn-new-cat-save').disabled = true;
});

document.getElementById('btn-new-cat-save').addEventListener('click', () => {
  const name = document.getElementById('new-cat-name').value.trim();
  if (!name) return;
  addCat(name, newCatColor);
  document.getElementById('add-cat-form').classList.add('hidden');
  document.getElementById('btn-show-add-cat').style.display = '';
  document.getElementById('new-cat-name').value = '';
  document.getElementById('btn-new-cat-save').disabled = true;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

// ── Init ─────────────────────────────────────────────
load(); loadCats(); render(); renderCatGrid();
</script>
